project_id = "pcvraalvtnmogirblvxq"

# desliga a verificação de JWT pra esta function: ela é um endpoint público
# (o formulário diagnostico-lead é preenchido por visitantes sem login).
# Sem isso, o deploy automático via integração GitHub aplicaria o padrão
# (JWT obrigatório) e todo POST do formulário voltaria 401.
[functions.diagnostico-lead]
verify_jwt = false

# a Plataforma de Insights faz sua própria autenticação dentro da function
# (SYNC_SECRET pro cron via pg_net, JWT de usuário logado pro botão manual)
# porque o cron não consegue mandar o header padrão que o verify_jwt exige.
[functions.sync-meta-insights]
verify_jwt = false
